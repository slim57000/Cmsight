<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement réussi | Cmsight</title>
<meta name="description" content="Votre licence EU Compliance Suite a été activée, la clé vous a été envoyée par email.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <nav>
    <a href="/index.html" class="logo">
      <span class="logo-badge">🔥</span>
      Cmsight<span class="dot">.</span>
    </a>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="container hero-inner">
      <span class="eyebrow">✅ Paiement confirmé</span>
      <h1 id="success-title">Merci pour votre achat</h1>
      <p class="lead" id="success-lead">Votre paiement a été validé.</p>
      <div class="hero-actions">
        <a href="/index.html" id="success-back-link" class="btn btn-primary">Voir Cmsight</a>
        <a href="/index.html" class="btn btn-ghost">Accueil</a>
      </div>
      <p class="hero-note">Vous ne recevez rien après quelques minutes ? Vérifiez vos spams ou écrivez-nous à contact@rampedigitale.fr</p>

      <script>
        (function () {
          var product = new URLSearchParams(window.location.search).get('product');
          var title = document.getElementById('success-title');
          var lead = document.getElementById('success-lead');
          var backLink = document.getElementById('success-back-link');
          if (product === 'cmsight') {
            title.innerHTML = 'Merci pour votre achat <span class="grad">Cmsight</span>';
            lead.textContent = "Votre paiement a été validé. Nous vous recontactons très prochainement par email pour finaliser l'activation de votre licence.";
          } else {
            title.innerHTML = 'Merci pour votre achat <span class="grad">EU Compliance Suite</span>';
            lead.textContent = "Votre paiement a été validé. Une clé de licence vient de vous être envoyée par email, avec les instructions d'activation.";
            backLink.textContent = 'Retour à EU Compliance Suite';
            backLink.href = '/eu-compliance-suite.html';
          }
        })();
      </script>
    </div>
  </section>
</main>

<footer>
  Créé par <a href="https://www.rampedigitale.fr">Rampe Digitale</a> · rampedigitale.fr
</footer>

<script src="/script.js"></script>

</body>
</html>
