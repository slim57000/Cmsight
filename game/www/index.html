<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1830">
<title>Stack & Snap</title>
<style>
:root{--bg:#1b1830;--panel:#2a2548;--txt:#f4f1ff;--mut:#a9a2cc;--acc:#ffcf5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{transition:background 1.2s;margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 0 6px;gap:8px}
.stat{background:var(--panel);border-radius:12px;padding:6px 12px;min-width:84px;text-align:center}
.stat small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.stat b{font-size:20px}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--panel);color:var(--txt);cursor:pointer}
button.primary{background:var(--acc);color:#2a2000;font-weight:700}
#next{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;color:var(--mut);font-size:13px;min-height:44px}
#next canvas{width:36px;height:36px}
#board{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
#c{touch-action:none}
#ham.on{background:var(--acc);color:#2a2000}
#newbest{color:var(--acc);font-weight:800;display:none}
#combo{position:absolute;top:8px;left:0;right:0;text-align:center;font-weight:800;font-size:28px;color:var(--acc);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px}
.modal .card{max-height:90vh;overflow:auto;background:var(--panel);border-radius:20px;padding:24px;text-align:center;max-width:320px;width:100%}
.modal h2{margin:0 0 8px}.modal p{color:var(--mut);margin:4px 0 16px}
.modal .row{flex-wrap:wrap;display:flex;gap:8px;justify-content:center}
.card h3{margin:16px 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;text-align:left}
.mi{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff12;text-align:left;font-size:14px}.mi.done{opacity:.5}.mi b{white-space:nowrap}
#skins{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.sk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;background:#ffffff10}.sk.on{outline:2px solid var(--acc)}
.sk i{width:28px;height:28px;display:block}.sk small{color:var(--mut);font-size:11px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <button id="mode">Classique</button>
    <div class="stat"><small>Record</small><b id="best">0</b></div>
  </header>
  <div id="next">Suivant <canvas id="n1" width="72" height="72"></canvas><canvas id="n2" width="72" height="72" style="opacity:.5;width:28px;height:28px"></canvas><button id="ham" style="padding:6px 10px">🔨 1</button><button id="menuBtn" style="padding:6px 10px">🪙 <span id="coinsTop">0</span></button><button id="snd" aria-label="Son" style="padding:6px 10px">🔊</button></div>
  <div id="board"><canvas id="c"></canvas><div id="combo"></div></div>
</div>
<div id="over" class="modal"><div class="card">
  <h2>Partie terminée</h2>
  <div id="newbest">🏆 Nouveau record !</div>
  <p id="ovtxt"></p>
  <p id="earn"></p>
  <div class="row"><button class="primary" id="cont">Continuer</button><button id="again">Rejouer</button><button id="share">Partager</button><button id="dbl">📺 Doubler les pièces</button></div>
</div></div>
<div id="menu" class="modal"><div class="card">
  <h2>🪙 <span id="coins">0</span></h2>
  <h3>Missions du jour</h3><div id="missions"></div>
  <h3>Skins</h3><div id="skins"></div>
  <button class="primary" id="closeMenu">Fermer</button>
</div></div>
<script>
(() => {
const COLS = 5, ROWS = 7;
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let grid, cur, nxt, score, maxLv, busy, over, rng, daily = false, hoverCol = -1, cell = 60, dpr = 1;
let fx = [], gs, hams, nextHam, hamMode, continued, startBest;

const store = {
  get(k){ try { return +localStorage.getItem(k) || 0 } catch { return 0 } },
  set(k,v){ try { localStorage.setItem(k, v) } catch {} },
  json(k, d){ try { return JSON.parse(localStorage.getItem(k)) || d } catch { return d } }
};
const bestKey = () => daily ? 'ss_best_' + today() : 'ss_best';
const today = () => new Date().toISOString().slice(0,10);
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const seed = s => [...s].reduce((h,c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261);
const vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms) } catch {} };
let actx, muted = store.get('ss_mute') === 1;
function tone(freq, dur = .12, type = 'sine', vol = .18, slide = 0, delay = 0){
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch {}
}
const sfx = {
  drop: () => tone(180, .09, 'triangle', .25, .5),
  merge: (lv, combo) => { const f = 330 * 2 ** (((lv - 1) % 12) / 12) * (1 + (combo - 1) * .25);
    tone(f, .14, 'triangle', .2); tone(f * 1.5, .18, 'sine', .12, 1, .05) },
  over: () => [440, 370, 311, 220].forEach((f, i) => tone(f, .22, 'square', .07, 1, i * .15))
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const label = lv => { const v = 2 ** lv; return v >= 1e6 ? (v/1048576|0)+'M' : v >= 1e4 ? (v/1024|0)+'K' : ''+v };
const SKINS = [
  {id:'classic', name:'Classique', price:0,   r:12, col: lv => `hsl(${(lv*47+200)%360} 72% ${lv%2?58:66}%)`},
  {id:'candy',   name:'Bonbons',   price:150, r:24, col: lv => `hsl(${(lv*37+300)%360} 85% ${lv%2?72:80}%)`},
  {id:'neon',    name:'Néon',      price:300, r:6,  col: lv => `hsl(${(lv*61+90)%360} 100% 55%)`},
  {id:'gold',    name:'Or & Nuit', price:500, r:2,  col: lv => `hsl(${45-lv*2} 90% ${Math.max(52, 80-lv*2)}%)`},
];
let coins = store.get('ss_coins'), owned = store.json('ss_owned', ['classic']), skinId = (() => { try { return localStorage.getItem('ss_skin') || 'classic' } catch { return 'classic' } })();
const skin = () => SKINS.find(k => k.id === skinId) || SKINS[0];
const color = lv => skin().col(lv);
// Publicités récompensées : AdMob en natif (Capacitor), simulées sur le web
const AD_IDS = {android: 'ca-app-pub-3940256099942544/5224354917', ios: 'ca-app-pub-3940256099942544/1712485313'}; // IDs de test Google
const ads = {
  async rewarded(){
    const C = window.Capacitor, A = C?.Plugins?.AdMob;
    if (!A || !C.isNativePlatform?.()) { await sleep(300); return true }
    try { await A.initialize(); await A.prepareRewardVideoAd({adId: AD_IDS[C.getPlatform()]}); return !!(await A.showRewardVideoAd()) } catch { return false }
  }
};
// Missions du jour : 3 missions tirées de la date, identiques pour tous
const MISSIONS = {
  tile:   (g) => [`Atteins la tuile ${label(g)}`, () => maxLv],
  combo:  (g) => [`Fais un combo x${g}`, () => gs.combo],
  score:  (g) => [`Marque ${g} points en une partie`, () => score],
  merges: (g) => [`Fusionne ${g} fois aujourd'hui`, () => ms.merges],
};
let ms = store.json('ss_ms', {});
function loadMissions(){
  if (ms.date === today()) return;
  const rr = mulberry(seed(today() + 'm')), pick = n => Math.floor(rr() * n);
  const opts = [['tile', 7 + pick(3), 60], ['combo', 3 + pick(2), 50], ['score', 1000 * (2 + pick(4)), 60], ['merges', 30 + 10 * pick(4), 40]];
  opts.splice(pick(4), 1);
  ms = {date: today(), merges: 0, list: opts.map(([t, g, rw]) => ({t, g, r: rw, done: false}))};
  save();
}
function checkMissions(){
  for (const m of ms.list) if (!m.done) { const [txt, val] = MISSIONS[m.t](m.g);
    if (val() >= m.g) { m.done = true; coins += m.r; toast(`🎯 ${txt} ! +${m.r} 🪙`); tone(660, .15); tone(990, .25, 'sine', .15, 1, .12); save() } }
}
function save(){
  store.set('ss_coins', coins); store.set('ss_owned', JSON.stringify(owned));
  store.set('ss_skin', skinId); store.set('ss_ms', JSON.stringify(ms));
}
function renderMenu(){
  $('coins').textContent = coins;
  $('missions').innerHTML = ms.list.map(m => { const [txt, val] = MISSIONS[m.t](m.g);
    return `<div class="mi ${m.done ? 'done' : ''}"><span>${txt}</span><b>${m.done ? '✅' : (m.t === 'tile' ? label(Math.min(val(), m.g)) + '/' + label(m.g) : Math.min(val(), m.g) + '/' + m.g) + ' · +' + m.r + '🪙'}</b></div>` }).join('');
  $('skins').innerHTML = SKINS.map(k => `<button class="sk ${k.id === skinId ? 'on' : ''}" data-k="${k.id}"><i style="background:${k.col(3)};border-radius:${k.r/2}px"></i>${k.name}<small>${owned.includes(k.id) ? (k.id === skinId ? 'Équipé' : 'Choisir') : k.price + ' 🪙'}</small></button>`).join('');
}

function randLv(){
  const top = Math.max(1, Math.min(maxLv - 1, 6));
  const r = rng();
  return 1 + Math.floor(r * r * top);         // biaisé vers les petites valeurs
}
function newGame(){
  grid = Array.from({length: COLS}, () => []);
  rng = daily ? mulberry(seed(today())) : Math.random;
  score = 0; maxLv = 3; busy = false; over = false;
  fx = []; gs = {combo: 0}; hams = 1; nextHam = 1500; hamMode = false; continued = false; startBest = store.get(bestKey());
  cur = randLv(); nxt = randLv();
  $('over').style.display = 'none';
  $('mode').textContent = daily ? 'Défi du jour' : 'Classique';
  ui();
}
function ui(){
  $('score').textContent = score;
  const b = Math.max(store.get(bestKey()), score);
  store.set(bestKey(), b); $('best').textContent = b;
  while (score >= nextHam) { hams++; nextHam += 1500; tone(880, .2, 'sine', .15) }
  loadMissions(); checkMissions();
  $('coinsTop').textContent = coins;
  document.documentElement.style.setProperty('--bg', `hsl(${(250 + (maxLv - 3) * 23) % 360} 32% 14%)`);
  $('ham').textContent = '🔨 ' + hams; $('ham').classList.toggle('on', hamMode);
  drawTile($('n1').getContext('2d'), cur); drawTile($('n2').getContext('2d'), nxt);
}
function drawTile(g, lv){
  g.clearRect(0,0,72,72); rrect(g, 4,4,64,64,skin().r*1.1, color(lv));
  g.fillStyle = '#1b1830'; g.font = `800 ${label(lv).length > 3 ? 20 : 26}px system-ui`;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label(lv), 36, 38);
}
function rrect(g,x,y,w,h,r,fill){ g.beginPath(); g.roundRect ? g.roundRect(x,y,w,h,r) : g.rect(x,y,w,h); g.fillStyle = fill; g.fill() }

function neighbors(c, r){
  return [[c-1,r],[c+1,r],[c,r-1],[c,r+1]].filter(([x,y]) => grid[x] && grid[x][y]);
}
async function drop(c){
  if (busy || over) return;
  busy = true;
  grid[c].push({lv: cur, vy: ROWS + .5, s: 1, fresh: true});
  cur = nxt; nxt = randLv(); ui(); vibrate(8); sfx.drop();
  await sleep(140);
  await resolve();
  if (grid.some(col => col.length > ROWS)) return end();
  busy = false; ui();
}
async function resolve(){
  let combo = 0;
  for (;;) {
    let group = null, target = null;
    outer: for (let c = 0; c < COLS; c++) for (let r = 0; r < grid[c].length; r++) {
      const t = grid[c][r]; if (!t.fresh) continue;
      const seen = new Set([t]), q = [[c,r]], g = [t];
      while (q.length) { const [x,y] = q.pop();
        for (const [nx,ny] of neighbors(x,y)) { const n = grid[nx][ny];
          if (n.lv === t.lv && !seen.has(n)) { seen.add(n); g.push(n); q.push([nx,ny]) } } }
      if (g.length > 1) { group = g; target = t; break outer }
    }
    if (!group) break;
    combo++;
    const before = new Map(); grid.forEach(col => col.forEach((t,i) => before.set(t,i)));
    target.lv += group.length - 1; target.s = 1.35;
    if (target.lv > maxLv && target.lv >= 6) toast('✨ Nouvelle tuile ' + label(target.lv) + ' !');
    maxLv = Math.max(maxLv, target.lv); gs.combo = Math.max(gs.combo, combo); ms.merges++;
    score += 2 ** target.lv * combo;
    const dead = new Set(group.filter(t => t !== target));
    for (let c = 0; c < COLS; c++) grid[c] = grid[c].filter(t => !dead.has(t));
    grid.forEach(col => col.forEach((t,i) => t.fresh = t === target || before.get(t) !== i));
    vibrate(combo > 1 ? [15,30,15] : 15); sfx.merge(target.lv, combo);
    if (combo > 1) toast('Combo x' + combo);
    const tc = grid.findIndex(col => col.includes(target)), tr = grid[tc].indexOf(target);
    burst(tc*cell + cell/2, cell*(ROWS+1) - (tr+.5)*cell, color(target.lv), '+' + 2 ** target.lv * combo);
    ui();
    await sleep(200);
  }
  grid.forEach(col => col.forEach(t => t.fresh = false));
}
function burst(x, y, col, txt){
  for (let i = 0; i < 14; i++) { const a = Math.random()*6.28, v = 2 + Math.random()*4;
    fx.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 2, life: 1, col}) }
  fx.push({x, y, txt, life: 1.2});
}
async function smash(e){
  const b = cv.getBoundingClientRect(), c = colAt(e), rw = Math.floor((b.bottom - e.clientY) / (b.height / (ROWS+1)));
  if (busy || !grid[c][rw]) return;
  busy = true; hamMode = false; hams--;
  const t = grid[c][rw]; burst(c*cell + cell/2, cell*(ROWS+1) - (rw+.5)*cell, color(t.lv));
  grid[c].splice(rw, 1); grid[c].forEach((t, i) => t.fresh = i >= rw);
  tone(120, .2, 'sawtooth', .15, .4); vibrate(30); ui();
  await sleep(160); await resolve();
  busy = false; ui();
}
function toast(txt){
  const el = $('combo'); el.textContent = txt;
  el.style.opacity = 1; el.style.transform = 'scale(1.15)';
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.opacity = 0; el.style.transform = 'scale(1)' }, 900);
}
function end(){
  over = true; busy = false; hamMode = false; ui();
  $('newbest').style.display = score > startBest && startBest > 0 ? 'block' : 'none';
  $('cont').style.display = continued ? 'none' : '';
  const earned = Math.floor(score / 20); coins += earned; save(); ui();
  $('earn').textContent = `+${earned} 🪙`; $('dbl').style.display = earned ? '' : 'none'; $('dbl').dataset.n = earned; vibrate([40,60,80]); sfx.over();
  $('ovtxt').textContent = `Score ${score} · meilleure tuile ${label(maxLv)}` + (daily ? ' · Défi du jour' : '');
  setTimeout(() => $('over').style.display = 'flex', 400);
}

function resize(){
  const b = $('board').getBoundingClientRect();
  cell = Math.floor(Math.min(b.width / COLS, (b.height - 8) / (ROWS + 1)));
  dpr = window.devicePixelRatio || 1;
  cv.style.width = cell*COLS + 'px'; cv.style.height = cell*(ROWS+1) + 'px';
  cv.width = cell*COLS*dpr; cv.height = cell*(ROWS+1)*dpr;
}
function frame(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W = cell*COLS, H = cell*(ROWS+1);
  ctx.clearRect(0,0,W,H);
  // zone de danger (ligne du haut)
  ctx.fillStyle = '#ff5c7a22'; ctx.fillRect(0,0,W,cell);
  ctx.strokeStyle = '#ff5c7a'; ctx.setLineDash([6,6]); ctx.beginPath(); ctx.moveTo(0,cell); ctx.lineTo(W,cell); ctx.stroke(); ctx.setLineDash([]);
  for (let c = 0; c < COLS; c++) {
    rrect(ctx, c*cell+3, cell+3, cell-6, H-cell-6, 10, c === hoverCol && !busy ? '#ffffff14' : '#ffffff08');
    grid[c].forEach((t, r) => {
      t.vy += (r - t.vy) * .35; t.s += (1 - t.s) * .2;
      const y = H - (t.vy + 1) * cell, sz = (cell - 8) * t.s, o = (cell - sz) / 2;
      rrect(ctx, c*cell+o, y+o, sz, sz, skin().r*cell/60*t.s, color(t.lv));
      const L = label(t.lv);
      ctx.fillStyle = '#1b1830'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `800 ${cell * (L.length > 3 ? .3 : .38) * t.s}px system-ui`;
      ctx.fillText(L, c*cell + cell/2, y + cell/2 + 1);
    });
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  fx = fx.filter(p => (p.life -= .025) > 0);
  for (const p of fx) {
    ctx.globalAlpha = Math.min(1, p.life);
    if (p.txt) { p.y -= 1.2; ctx.fillStyle = '#fff'; ctx.font = `800 ${cell*.32}px system-ui`; ctx.fillText(p.txt, p.x, p.y) }
    else { p.x += p.vx; p.y += p.vy; p.vy += .25; ctx.fillStyle = p.col; ctx.fillRect(p.x-3, p.y-3, 6, 6) }
  }
  ctx.globalAlpha = 1;
  if (!score && grid.every(col => !col.length)) { ctx.fillStyle = '#a9a2cc'; ctx.font = `600 ${cell*.26}px system-ui`;
    ctx.fillText('Touchez une colonne pour lâcher la tuile', W/2, H/2); ctx.fillText('Les tuiles identiques fusionnent !', W/2, H/2 + cell*.4) }
  if (hamMode) { ctx.fillStyle = '#ffcf5c'; ctx.font = `700 ${cell*.26}px system-ui`; ctx.fillText('🔨 Touchez une tuile à casser', W/2, cell/2) }
  requestAnimationFrame(frame);
}
const colAt = e => { const r = cv.getBoundingClientRect(); return Math.max(0, Math.min(COLS-1, Math.floor((e.clientX - r.left) / (r.width / COLS)))) };
cv.addEventListener('pointermove', e => hoverCol = colAt(e));
cv.addEventListener('pointerleave', () => hoverCol = -1);
cv.addEventListener('pointerdown', e => hamMode ? smash(e) : drop(colAt(e)));
const sndBtn = $('snd'), sndUi = () => sndBtn.textContent = muted ? '🔇' : '🔊'; sndUi();
sndBtn.onclick = () => { muted = !muted; store.set('ss_mute', muted ? 1 : 0); sndUi(); sfx.drop() };
$('again').onclick = newGame;
// « Continuer » : une fois par partie (emplacement pour une pub récompensée)
$('cont').onclick = async () => { if (!(await ads.rewarded())) return; continued = true; over = false; grid.forEach(col => col.splice(-3)); $('over').style.display = 'none'; tone(523, .15); tone(784, .2, 'sine', .15, 1, .1); ui() };
$('dbl').onclick = async () => { if (!(await ads.rewarded())) return; coins += +$('dbl').dataset.n; save(); ui();
  $('earn').textContent = `+${$('dbl').dataset.n * 2} 🪙`; $('dbl').style.display = 'none' };
$('menuBtn').onclick = () => { if (busy) return; renderMenu(); $('menu').style.display = 'flex' };
$('closeMenu').onclick = () => $('menu').style.display = 'none';
$('skins').onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; const k = SKINS.find(s => s.id === b.dataset.k);
  if (!owned.includes(k.id)) { if (coins < k.price) { b.querySelector('small').textContent = 'Pas assez 🪙'; return } coins -= k.price; owned.push(k.id); tone(784, .2) }
  skinId = k.id; save(); renderMenu(); ui() };
$('ham').onclick = () => { if (busy || over || !hams) return; hamMode = !hamMode; ui() };
$('mode').onclick = () => { if (busy) return; daily = !daily; newGame() };
$('share').onclick = async () => {
  const text = `J'ai fait ${score} points sur Stack & Snap${daily ? ' (Défi du jour ' + today() + ')' : ''} ! Tu fais mieux ?`;
  try { if (navigator.share) await navigator.share({text}); else { await navigator.clipboard.writeText(text); $('share').textContent = 'Copié !' } } catch {}
};
addEventListener('resize', resize);
resize(); newGame(); frame();
})();
</script>
</body>
</html>
