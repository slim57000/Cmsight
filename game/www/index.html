<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1830">
<title>Stack & Snap</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
:root{--bg:#1b1830;--panel:#2a2548;--txt:#f4f1ff;--mut:#a9a2cc;--acc:#ffcf5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation;transition:background 1.2s}
#bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7}
body[data-bg=bg_stars] #bgfx{background-image:radial-gradient(1.5px 1.5px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 35%,#fff,transparent),radial-gradient(1px 1px at 75% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 15%,#fff,transparent),radial-gradient(1px 1px at 45% 90%,#fff,transparent);background-size:220px 220px;animation:drift 40s linear infinite}
body[data-bg=bg_aurora] #bgfx{background:linear-gradient(120deg,#5b2a86,#0f5f6b,#7a2d6b,#1f3f8a);background-size:400% 400%;animation:aurora 14s ease infinite;opacity:.45}
@keyframes drift{to{background-position:0 -220px}}@keyframes aurora{50%{background-position:100% 50%}}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
#topbar{display:flex;gap:8px;padding-top:10px}#topbar .sp{flex:1}#topbar button{padding:8px 12px;font-size:16px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 0 4px;gap:8px}
.stat{background:var(--panel);border-radius:12px;padding:6px 12px;min-width:84px;text-align:center}
.stat small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}.stat b{font-size:20px}
#info{text-align:center;color:var(--acc);font-weight:700;font-size:14px;min-height:20px}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--panel);color:var(--txt);cursor:pointer}
button:disabled{opacity:.4}button.primary{background:var(--acc);color:#2a2000;font-weight:700}
#next{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;color:var(--mut);font-size:13px;min-height:44px}
#next canvas{width:36px;height:36px;cursor:pointer}#next button{padding:6px 10px}#ham.on{background:var(--acc);color:#2a2000}
#board{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}#c{touch-action:none}
#toast{position:absolute;top:8px;left:8px;right:8px;text-align:center;font-weight:800;font-size:20px;color:var(--acc);opacity:0;transform:translateY(-6px);transition:.25s;pointer-events:none;text-shadow:0 2px 8px #0008}
#toast.on{opacity:1;transform:none}
.modal{position:fixed;inset:0;z-index:5;background:#0009;display:none;align-items:center;justify-content:center;padding:16px}
.card{max-height:90vh;overflow:auto;background:var(--panel);border-radius:20px;padding:22px;text-align:center;max-width:360px;width:100%}
.card h2{margin:0 0 8px}.card p{color:var(--mut);margin:4px 0 12px}
.card h3{margin:16px 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;text-align:left}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.mi,.item,.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff12;text-align:left;font-size:14px}
.mi.done{opacity:.5}.mi b{white-space:nowrap}
.item small{display:block;color:var(--mut);font-size:12px}.item button{padding:8px 12px;white-space:nowrap;background:#ffffff18}.item button.primary{background:var(--acc)}
.item.best{background:#ffcf5c14;border-radius:12px;padding:10px;border:1px solid #ffcf5c55}
.item.flash{background:#ff5c7a1c;border-radius:12px;padding:10px;border:1px solid #ff5c7a88}
.tag{display:block;color:var(--acc);font-size:11px;font-weight:700;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;background:#ffffff10}.sk.on{outline:2px solid var(--acc)}
.sk i{width:28px;height:28px;display:block}.sk small{color:var(--mut);font-size:11px}
.opt input{accent-color:var(--acc);width:22px;height:22px}.opt input[type=range]{width:50%}
select,textarea{font:inherit;background:var(--bg);color:var(--txt);border:0;border-radius:10px;padding:8px}
textarea{width:100%;height:64px;font-size:11px;margin-top:8px;user-select:text}
#top{text-align:left;margin:0;padding-left:24px}#top small{color:var(--mut)}
.modes button{display:block;width:100%;text-align:left;margin-bottom:8px;background:#ffffff10}.modes small{display:block;color:var(--mut);font-size:12px}
#lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}#lvls button{padding:8px 0;font-size:14px;background:#ffffff14}#lvls small{display:block;font-size:9px;color:var(--acc);min-height:11px}
.tier{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}.tier b{color:var(--mut)}.tier.on b{color:var(--acc)}
.tier button{padding:8px 4px;font-size:12px;background:#ffffff12}.tier button:not(:disabled){background:var(--acc);color:#2a2000;font-weight:700}
.bar{height:10px;background:#ffffff18;border-radius:6px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--acc)}
#days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}#days div{background:#ffffff10;border-radius:10px;padding:8px 2px;font-size:12px}
#days .on{outline:2px solid var(--acc);background:#ffcf5c22}#days .past{opacity:.4}
@media (max-width:380px){#next>span{display:none}}
</style>
</head>
<body>
<div id="bgfx"></div>
<div id="app">
  <div id="topbar"><button id="menuBtn">🪙 <span id="coinsTop">0</span></button><button id="passBtn">🎖️ <span id="passTop">0</span></button><span class="sp"></span><button id="shopBtn" aria-label="Shop">🛒</button><button id="optBtn" aria-label="Options">⚙️</button></div>
  <header>
    <div class="stat"><small data-i="score"></small><b id="score">0</b></div>
    <button id="mode"></button>
    <div class="stat"><small data-i="best"></small><b id="best">0</b></div>
  </header>
  <div id="info"></div>
  <div id="next"><span data-i="next"></span><canvas id="n1" width="72" height="72"></canvas><canvas id="n2" width="72" height="72" style="opacity:.6;width:28px;height:28px"></canvas><button id="ham">🔨</button><button id="undo">↩️</button><button id="shuf">🔀</button></div>
  <div id="board"><canvas id="c"></canvas><div id="toast"></div></div>
</div>

<div id="over" class="modal"><div class="card">
  <h2 id="ovTitle"></h2><div id="newbest" data-i="newbest" style="color:var(--acc);font-weight:800"></div>
  <p id="ovtxt"></p><p id="earn" style="color:var(--acc);font-weight:700"></p>
  <div class="row">
    <button class="primary" id="nextlvl" data-i="nextlvl"></button><button class="primary" id="cont" data-i="cont"></button><button id="again" data-i="again"></button>
    <button id="shareImg" data-i="share"></button><button id="chall" data-i="challenge"></button><button id="dbl" data-i="dbl"></button>
    <button id="offerBtn" data-i="offer" style="background:#ff5c7a;color:#fff"></button>
  </div></div></div>

<div id="menu" class="modal"><div class="card">
  <h2>🪙 <span id="coins">0</span></h2><p id="streakTxt"></p>
  <h3 data-i="missions"></h3><div id="missions"></div>
  <h3><span data-i="ach"></span> <span id="achCount"></span></h3><div id="achs"></div>
  <h3 data-i="skins"></h3><div id="skins" class="grid2"></div>
  <h3 data-i="top"></h3><ol id="top"></ol><button id="gc" data-i="leaderboard" style="margin-top:8px"></button>
  <h3 data-i="stats"></h3><div id="stats"></div>
  <div class="row"><button class="primary" data-close data-i="close"></button></div></div></div>

<div id="shop" class="modal"><div class="card">
  <h2>🛒 <span data-i="shop"></span></h2><p id="shopInv"></p>
  <h3 data-i="premium"></h3><div id="iap"></div>
  <h3 data-i="withcoins"></h3><div id="coinshop"></div>
  <h3 data-i="themes"></h3><div id="themes"></div>
  <div class="row"><button id="restore" data-i="restore"></button><button class="primary" data-close data-i="close"></button></div></div></div>

<div id="pass" class="modal"><div class="card">
  <h2>🎖️ <span data-i="pass"></span></h2><p id="passLvl"></p><div class="bar"><i id="passBar"></i></div>
  <button class="primary" id="buyPass"></button>
  <div class="tier" style="margin-top:12px"><b></b><small data-i="free"></small><small data-i="premiumTrack"></small></div>
  <div id="passList"></div>
  <div class="row"><button class="primary" data-close data-i="close"></button></div></div></div>

<div id="chest" class="modal"><div class="card">
  <h2>🎁 <span data-i="chest"></span></h2><p id="chestTxt"></p><div id="days"></div>
  <div class="row"><button class="primary" id="claim" data-i="claim"></button><button id="claim2" data-i="dbl"></button></div></div></div>

<div id="modes" class="modal"><div class="card">
  <h2 data-i="modes"></h2><div class="modes" id="modeList"></div>
  <div class="row"><button data-close data-i="close"></button></div></div></div>

<div id="levels" class="modal"><div class="card">
  <h2 data-i="levels"></h2><div id="lvls"></div>
  <div class="row"><button data-close data-i="close"></button></div></div></div>

<div id="opts" class="modal"><div class="card">
  <h2 data-i="options"></h2>
  <label class="opt"><span data-i="sound"></span><input type="checkbox" id="oSnd"></label>
  <label class="opt"><span data-i="volume"></span><input type="range" id="oVol" min="0" max="100"></label>
  <label class="opt"><span data-i="vibration"></span><input type="checkbox" id="oVib"></label>
  <label class="opt"><span data-i="notif"></span><input type="checkbox" id="oNotif"></label>
  <label class="opt"><span data-i="language"></span><select id="oLang"></select></label>
  <h3 data-i="save"></h3>
  <div class="row" style="margin-top:0"><button id="exportBtn" data-i="export"></button><button id="importBtn" data-i="import"></button></div>
  <textarea id="code" spellcheck="false"></textarea>
  <div class="row"><button id="privacy" data-i="privacy"></button><button class="primary" data-close data-i="close"></button></div></div></div>

<script src="i18n.js"></script>
<script src="game.js"></script>
</body>
</html>
